name: CI - Main Branch

# Read-only by default. Jobs that need more scope (cache cleanup needs
# `actions: write`) declare it on the job itself — least privilege.
permissions:
    contents: read

on:
    push:
        branches: [main]

    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    markdown:
        name: Lint Markdown
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Setup Node.js
              id: setup-node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                node-version: "lts/*"

            # Keyed on the lockfile so a markdownlint-cli2 bump invalidates it.
            - name: Restore npm cache
              id: npm-cache-restore
              uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
              with:
                path: ~/.npm
                key: npm-markdownlint-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
                restore-keys: |
                    npm-markdownlint-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-

            # `npm ci` installs the exact pinned version from package-lock.json.
            - name: Install dependencies
              run: npm ci

            # Globs and ignores come from .markdownlint-cli2.jsonc.
            - name: Lint Markdown
              run: npm run lint

            # Save the npm cache only on a miss (i.e. the lockfile changed).
            # This is the only workflow with write access to the cache —
            # PRs restore it read-only.
            - name: Save npm cache
              if: steps.npm-cache-restore.outputs.cache-hit != 'true'
              uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
              with:
                path: ~/.npm
                key: npm-markdownlint-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

    cleanup-caches:
        name: Cleanup Stale Caches
        needs: markdown
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: always()

        # Deleting stale Actions caches via the REST API needs write scope.
        permissions:
            contents: read
            actions: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Cleanup stale caches
              uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
              env:
                INPUT_DRY_RUN: "false"
              with:
                script: |
                    const cleanupScript = require('./.github/scripts/cleanup-caches.js');
                    await cleanupScript({ github, context, core });
