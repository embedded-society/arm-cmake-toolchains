name: Cleanup GitHub Actions Caches

# Manual trigger only — use to proactively clean up caches. The main-branch
# workflow already prunes on every push; this is the on-demand escape hatch.
on:
    workflow_dispatch:
        inputs:
            dry_run:
                description: 'Log actions without deleting (for testing)'
                required: false
                type: boolean
                # Default to a safe dry run: an accidental manual trigger
                # then only logs what it *would* delete. Set to false to
                # actually delete caches.
                default: true

# Never run two cache cleanups concurrently — they race on the same
# REST cache list. Don't cancel an in-progress cleanup.
concurrency:
    group: cleanup-caches
    cancel-in-progress: false

jobs:
    cleanup:
        name: Cleanup Caches
        runs-on: ubuntu-latest
        timeout-minutes: 5

        permissions:
            actions: write
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Run cleanup script
              uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
              env:
                INPUT_DRY_RUN: ${{ inputs.dry_run || false }}
              with:
                script: |
                    const cleanupScript = require('./.github/scripts/cleanup-caches.js');
                    await cleanupScript({ github, context, core });
